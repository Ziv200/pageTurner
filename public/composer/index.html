<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageTurner Composer</title>
    <link rel="stylesheet" href="composer.css">
    <script src="../vendor/pdf.min.js"></script>
    <script src="../vendor/pdf-lib.min.js"></script>
</head>
<body>
<header>
    <h1>Composer</h1>
    <a class="back" href="/">&larr; PageTurner</a>
</header>

<main>
    <section class="toolbar">
        <label class="field">Project name
            <input id="project-name" type="text" value="Untitled" dir="auto" maxlength="100">
        </label>
        <div class="buttons">
            <button id="btn-new">New</button>
            <button id="btn-open-mac">Open from Mac&hellip;</button>
            <button id="btn-open-file">Open .pdset file&hellip;</button>
            <button id="btn-save-mac" class="primary">Save to Mac</button>
            <button id="btn-save-file">Download .pdset</button>
        </div>
    </section>

    <section id="drop" class="drop" tabindex="0">
        <p><strong>Drop PDF files here</strong> or</p>
        <button id="btn-add" class="primary">Choose PDFs&hellip;</button>
        <p class="hint">Drag rows to reorder. Page range examples: <code>1-3,5</code> &middot; <code>4-</code> &middot; empty = all pages.</p>
    </section>

    <div id="notice" class="notice" hidden></div>

    <ol id="list" class="list"></ol>
    <p id="empty" class="empty">No PDFs yet.</p>

    <footer class="exportbar">
        <div id="summary">0 files &middot; 0 pages</div>
        <button id="btn-export" class="primary big" disabled>Export merged PDF</button>
    </footer>
</main>

<div id="dialog" class="dialog" hidden>
    <div class="box">
        <h2>Open from Mac</h2>
        <ul id="project-list"></ul>
        <button id="dialog-close">Close</button>
    </div>
</div>

<input id="file-pdf" type="file" accept="application/pdf,.pdf" multiple hidden>
<input id="file-pdset" type="file" accept=".pdset,application/json" hidden>
<script src="core.js"></script>
<script src="composer.js"></script>
</body>
</html>
